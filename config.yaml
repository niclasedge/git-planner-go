# git-planner configuration.
#
# This file is committable: it never contains a token, only the *name* of the
# environment variable to read one from. Put the actual values in .env, which is
# gitignored.

server:
  # Deliberately not 8090: that is files-tauri's port, and the monitor widget
  # below watches it. Binding the same port would collide on startup.
  bind: 127.0.0.1:8092

  # Also listen on this machine's Tailscale address, same port, so phone and
  # iPad can reach the planner. The address is discovered at startup — nothing
  # to configure, nothing to keep in sync.
  #
  # Not the same as bind: 0.0.0.0 — the app has no login, so a wildcard bind
  # would offer issue editing to every network this machine joins. This way only
  # loopback and the tailnet are served. Everyone in the tailnet can edit
  # issues with the tokens from .env; that is the whole security model.
  tailnet: true

  db-path: ./data/git-planner.db

# GitHub identities. Each token gets its own rate-limit budget, its own cache
# namespace and its own notification poll — so adding a work account does not
# eat into the personal one's 5000/h.
tokens:
  - name: personal
    env: GITHUB_PAT
    label: niclasedge

  - name: work
    env: GITHUB_PAT_WORK
    label: niclasedge-dgk

github:
  # Empty = discover everything each token can see (newest push first, archived
  # repos skipped). Name repos explicitly to keep the request count low:
  #   repos:
  #     - niclasedge/kite-public
  #     - niclasedge/glance
  repos: []

  refresh:
    # The inbox poll is the cheap change trigger: a 304 here means we can skip a
    # whole refresh round. GitHub's X-Poll-Interval overrides this if it is higher.
    notifications: 60s

    # Incremental: one cross-repo request for whatever changed since the last
    # poll, merged into what we already hold. Costs one request, not one per repo.
    issues: 5m

    # Actions has no cross-repo "runs since" endpoint, so this stays a per-repo
    # sweep — cheap because every request is conditional, but it does touch every
    # repo that has workflows.
    actions: 5m

    repos: 30m

    # Reconciliation: ask every repo directly, and refresh the GraphQL totals that
    # feed the planner's open/in-progress/closed trio. The incremental poll is
    # scoped to issues this account created, was assigned, was mentioned in or
    # subscribed to; this is what catches anything outside that.
    full: 1h

  issues:
    per-repo: 50
    state: open

  actions:
    runs-per-repo: 10
    # Jobs cost one request per run, and they are what draws the step dots.
    # Set to 0 to drop the dots and the cost with them.
    jobs-per-repo: 3

pages:
  - title: Issues
    type: issues

  # Three panes: agenda + repos, the selected repo's issues, one issue in detail.
  - title: Planner
    type: planner

  - title: Actions
    type: actions

  # The beads task graphs of the repos that track their work in beads
  # (github.com/gastownhall/beads) instead of GitHub issues. Reads the
  # committed .beads/issues.jsonl export; the Dolt DB itself is binary noms
  # chunks and unreadable over the API.
  #
  # discover: true sweeps every repo the token can see once a day, asking each
  # one for its .beads/ *directory* — one request that answers both "wird hier
  # mit beads gearbeitet" and "gibt es einen Export". Ein Repo mit DB, aber ohne
  # Export erscheint deshalb als solches, statt zu fehlen. Der Preis ist ein
  # 404 pro Repo pro Tag; ein 404 ist nie gratis, ein 24-Stunden-Takt ist es
  # praktisch schon (~240 Anfragen gegen 5000/h).
  #
  # repos: pinnt darüber hinaus: immer auf der Seite, in dieser Reihenfolge, und
  # der erste Eintrag ist der Default-Tab. Ein gepinntes Repo ohne beads bleibt
  # sichtbar — ein Tippfehler soll auffallen, nicht verschwinden.
  - title: Beads
    columns:
      - size: full
        widgets:
          - type: beads
            title: Beads · Task-Graph
            token-env: GITHUB_PAT
            cache: 5m
            discover: true
            discover-interval: 24h
            repos:
              - niclasedge/IaC-Stack
              - niclasedge/affiliate-hub-tools
              - niclasedge/graphviz-preview

  # From here on the config decides. Available widget types: monitor, bookmarks,
  # iframe, html.
  - title: Monitoring
    columns:
      - size: small
        widgets:
          # Getrennt nach „läuft hier“ und „läuft auf netcup3“ — zwei Fragen,
          # die eine gemeinsame Liste nicht beantwortet. Remote geht über die
          # Tailnet-IP, nicht über die öffentlichen Hostnamen.
          #
          # Auch die lokalen Dienste stehen mit der Tailnet-IP dieses Macs da,
          # nicht als localhost: im Container wäre localhost der Container.
          # So gilt dieselbe Datei nativ wie in Compose.
          - type: monitor
            title: Dienste
            cache: 60s
            groups:
              # Mac mini — der Always-on-Dienst-Host seit 2026-08-06.
              #
              # Geprüft wird die Traefik-Route, nicht ein Port: diese Dienste
              # publishen keinen mehr (validate_services.py verbietet einen Port
              # neben einer Domain, weil Dockers iptables-Regeln vor UFW sitzen
              # und der Port Traefiks TLS und Middlewares umginge).
              #
              # Zwei Voraussetzungen stecken deshalb im Stack und nicht hier:
              # die mkcert-CA im Trust Store des Images (Dockerfile) und die
              # extra_hosts-Einträge, weil dieser Host *.lan.niclasedge.com
              # sonst über webgos Wildcard auf sich selbst auflöst.
              # Mac mini — der Always-on-Dienst-Host seit 2026-08-06.
              #
              # Geprüft wird die Traefik-Route, nicht ein Port: diese Dienste
              # publishen keinen mehr (validate_services.py verbietet einen Port
              # neben einer Domain, weil Dockers iptables-Regeln vor UFW sitzen
              # und der Port Traefiks TLS und Middlewares umginge).
              #
              # Zwei Voraussetzungen stecken deshalb im Stack, nicht hier: die
              # mkcert-CA im Trust Store des Images (Dockerfile) und die
              # extra_hosts-Einträge, weil dieser Host *.lan.niclasedge.com
              # sonst über webgos Wildcard auf SICH SELBST auflöst — ein Check
              # hätte dann still den eigenen Traefik geprüft.
              #
              # Diese Checks waren am 07.08. schon einmal zurückgenommen, weil
              # von hier aus nichts durchkam: TCP-Handshakes gelangen, jede
              # HTTP-Anfrage lief in einen Timeout. Die Ursache war NICHT das
              # Netz, sondern eine haengende OrbStack-Engine auf dem Mini —
              # deren Host-Listener nimmt Verbindungen an, waehrend kein
              # Container mehr antwortet. Merksatz: bei "Port offen, aber keine
              # Daten" gegen einen Docker-Host zuerst die Engine pruefen
              # (curl --unix-socket … /_ping muss OK liefern, nicht leer).
              - title: Mac mini · Traefik
                sites:
                  - title: SearXNG
                    url: https://searxng.lan.niclasedge.com
                    timeout: 5s
                  - title: SearXNG · VPN
                    url: https://searxng-vpn.lan.niclasedge.com
                    timeout: 5s
                  - title: Kibana
                    url: https://kibana.lan.niclasedge.com
                    check-url: https://kibana.lan.niclasedge.com/api/status
                    timeout: 5s
                  - title: Traefik
                    url: https://traefik.lan.niclasedge.com
                    timeout: 5s
                  - title: Glance
                    url: https://glance.lan.niclasedge.com
                    timeout: 5s

              - title: Lokal · Docker
                sites:
                  # Kein Docker-Publish, lauscht nur auf Loopback — die
                  # Tailnet-IP bedient `tailscale serve --tcp=8090` auf dem
                  # Mac. So prüft dieselbe Zeile nativ wie aus dem
                  # netcup-Container (wo host.docker.internal nicht auflöst).
                  # Rot, solange die App nicht läuft.
                  - title: files-tauri
                    url: http://100.123.180.46:8090
                    timeout: 3s
                  - title: glance
                    url: http://100.123.180.46:3000
                    timeout: 3s
                  - title: grinde-viewer
                    url: http://100.123.180.46:8091
                    timeout: 3s

              # Seit dem Traefik-Umbau publishen die netcup-Dienste keine
              # Host-Ports mehr (kein `ports:` in ihren compose-Dateien) — die
              # alten Tailnet-IP:Port-Checks starben deshalb als „context
              # deadline exceeded“. Geprüft wird jetzt die Traefik-Route:
              # url und public-url sind dieselbe Adresse, weil es nur noch
              # diese eine beobachtbare Ebene gibt. Das Badge bleibt trotzdem,
              # es unterscheidet „öffentlich“ von „öffentlich · Auth“.
              # Nur Semaphore (3001) und SearXNG (8082) publishen weiterhin
              # einen Port und haben keine Domain — die bleiben auf der
              # Tailnet-IP. Die Domains stehen im IaC-Stack in services.yml
              # (domain_suffix: niclasedge.com); wer dort kein domain: hat,
              # ist bewusst intern.
              #
              # check-url zeigt auf den Health-Endpoint, wo services.yml einen
              # nennt — bei rss-reader zwingend, weil / hinter BasicAuth 401
              # liefert. glance und Global Dashboard haben keinen freien
              # Health-Pfad, dort IST der 401 der user-auth@file-Middleware
              # die gesunde Antwort: expect-status macht genau ihn grün und
              # schlägt an, falls die Auth je verschwindet.
              - title: netcup3 · Docker
                sites:
                  - title: Semaphore
                    url: http://100.109.141.47:3001
                  - title: SearXNG
                    url: http://100.109.141.47:8082
                  - title: Kanban
                    url: https://kanban.niclasedge.com
                    public-url: https://kanban.niclasedge.com
                  - title: ntfy
                    url: https://ntfy.niclasedge.com
                    public-url: https://ntfy.niclasedge.com
                  - title: Global Dashboard
                    url: https://kanban2.niclasedge.com
                    expect-status: 401
                    public-url: https://kanban2.niclasedge.com
                  - title: RSS-Reader
                    url: https://rss.niclasedge.com
                    check-url: https://rss.niclasedge.com/healthz
                    public-url: https://rss.niclasedge.com
                  - title: Family-Tree
                    url: https://family.niclasedge.com
                    check-url: https://family.niclasedge.com/api/health
                    public-url: https://family.niclasedge.com
                  - title: Miniflux
                    url: https://miniflux.niclasedge.com
                    check-url: https://miniflux.niclasedge.com/healthcheck
                    public-url: https://miniflux.niclasedge.com
                  - title: Healthchecks
                    url: https://health.niclasedge.com
                    public-url: https://health.niclasedge.com
                  - title: Uptime-Kuma
                    url: https://kuma.niclasedge.com
                    public-url: https://kuma.niclasedge.com
                  - title: Vaultwarden
                    url: https://vaultwarden.niclasedge.com
                    public-url: https://vaultwarden.niclasedge.com
                  - title: Beszel
                    url: https://beszel.niclasedge.com
                    public-url: https://beszel.niclasedge.com
                  - title: Plausible
                    url: https://plausible.niclasedge.com
                    public-url: https://plausible.niclasedge.com
                  - title: Jellyfin
                    url: https://jellyfin.niclasedge.com
                    public-url: https://jellyfin.niclasedge.com
                  - title: Ghost Wedding
                    url: https://art-weddings.de
                    public-url: https://art-weddings.de

              # Fremde Dienste: „ist das öffentlich erreichbar“ ist eine Frage
              # über eigene Hosts, deshalb hier kein Exposure-Badge.
              - title: Extern
                external: true
                sites:
                  - title: GitHub API
                    url: https://api.github.com
                    check-url: https://api.github.com/zen

          # Ollama läuft nativ auf dem Mac und lauscht nur auf Loopback — die
          # Tailnet-IP bedient `tailscale serve --tcp=11434` dort. Damit ist
          # Ollama aus dem netcup-Container erreichbar (host.docker.internal
          # löst dort nicht auf) und nativ genauso.
          # Die Laufzeit („läuft seit") kommt aus eigener Beobachtung, nicht von
          # Ollama: expires_at wird von jeder Anfrage nach vorn geschoben, einen
          # Ladezeitpunkt gibt die API nicht her. Auflösung = dieses Intervall.
          - type: ollama
            title: Ollama
            url: http://100.123.180.46:11434
            cache: 5m

          - type: bookmarks
            title: Schnellzugriff
            groups:
              - title: GitHub
                links:
                  - title: Notifications
                    url: https://github.com/notifications
                  - title: Pull Requests
                    url: https://github.com/pulls
                    description: alle offenen
                  - title: Issues
                    url: https://github.com/issues

      - size: full
        widgets:
          # Ansible Semaphore auf netcup3 (Tailnet-IP, kein Geheimnis). Das
          # Passwort steht ausschließlich in .env — hier nur der Variablenname.
          # Holen mit `just semaphore-password` im IaC-Stack-Repo.
          - type: semaphore
            title: IaC-Stack · Semaphore
            url: http://100.109.141.47:3001
            project: IaC-Stack
            user: admin
            password-env: SEMAPHORE_PASSWORD
            cache: 2m

          - type: html
            title: Notiz
            source: |
              <p style="color:#8b949e;margin:0">
                Diese Seite kommt komplett aus <code>config.yaml</code>.
                Weitere Seiten einfach als neuen <code>pages</code>-Eintrag anlegen.
              </p>
