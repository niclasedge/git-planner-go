<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="git-planner — Commit-Graph und Planzeilen">
  <!-- Links der Commit-Graph (git), rechts die Planzeilen (planner): das ist die
       ganze App in einem Bild. Bei 16 px bleiben genau diese zwei Formen uebrig,
       deshalb kein Rahmen, kein Text und kein vierter Zweig.
       Die Farben sind die der Ansicht: Akzent oklch(0.83 0.11 215),
       Erledigt-Gruen oklch(0.83 0.15 152). -->
  <style>
    .bg   { fill: #0b0d10; }
    .line { stroke: #4fc9dd; }
    .node { fill: #4fc9dd; }
    .barA { fill: #56d17a; }
    .barB { fill: #56606b; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #eff1f5; }
      .line { stroke: #209fb5; }
      .node { fill: #209fb5; }
      .barA { fill: #40a02b; }
      .barB { fill: #9ca0b0; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="32" height="32" rx="7"/>

  <!-- Commit-Graph: eine Spur, drei Commits. Abstand 8 und Radius 2.5, damit
       die Knoten bei 16 px noch als drei Punkte lesbar sind und nicht zu einem
       Balken verschmelzen; die Spur bleibt duenner als die Knoten. -->
  <path class="line" d="M10 8 V24" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <circle class="node" cx="10" cy="8"  r="2.5"/>
  <circle class="node" cx="10" cy="16" r="2.5"/>
  <circle class="node" cx="10" cy="24" r="2.5"/>

  <!-- Planzeilen: die oberste erledigt, die beiden darunter offen -->
  <rect class="barA" x="16" y="6.6"  width="11" height="2.8" rx="1.4"/>
  <rect class="barB" x="16" y="14.6" width="8"  height="2.8" rx="1.4"/>
  <rect class="barB" x="16" y="22.6" width="5"  height="2.8" rx="1.4"/>
</svg>
