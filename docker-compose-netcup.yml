# netcup deployment — one service behind Traefik, Basic Auth on top.
#
# Deliberately different from docker-compose.yml (the Mac one) in four ways,
# each with a reason:
#
#   * No published ports. Traefik reaches this container over the `proxy`
#     network via the labels below, and the app has no login — a published
#     port would offer issue editing to every interface of the host (glance's
#     own removal of its published port, IaC-Stack#75, is the same reasoning).
#     With GITPLANNER_BIND=0.0.0.0 the listener is reachable inside the
#     network; who is allowed to use it is decided at Traefik, by
#     user-auth@file.
#   * `tailnet: true` in config.yaml is a no-op here: listenAddrs() returns
#     early when bind is a wildcard ("server.tailnet ignored"). Traefik is the
#     only ingress, so that warning is expected, not a bug.
#   * data/ is a NAMED VOLUME, not a bind mount into the checkout. The SQLite
#     cache is runtime state; a git-pull deploy resets the working tree, and a
#     file the app rewrites within minutes would keep that reset blocked
#     forever (IaC-Stack CLAUDE.md, "Runtime-State und Deploy schließen sich
#     aus"). The named volume lives outside the checkout by construction.
#   * No extra_hosts / host.docker.internal: the Mac loopback services that
#     entry existed for do not exist on this host.
#
# The /healthz router carries NO middlewares label on purpose: IaC-Stack's
# post-deploy healthcheck polls https://git.niclasedge.com/healthz
# anonymously, and BasicAuth would answer 401. The endpoint returns a bare
# "ok" and reads no state, so exposing it unauthenticated leaks nothing.
# Same pattern as rss-reader (netcup-services/active/rss-reader).
services:
  git-planner:
    build: .
    image: git-planner:netcup
    container_name: git-planner
    restart: unless-stopped

    environment:
      GITPLANNER_BIND: 0.0.0.0:8092

    env_file:
      - .env

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - git-planner-data:/app/data

    # The Mac mini's lan zone, resolved explicitly.
    #
    # This host does NOT resolve *.lan.niclasedge.com: Tailscale DNS is disabled
    # on it (normal for a server — accepting it would hand the resolver of a VPS
    # running 48 services to the tailnet), so the query falls through to webgo's
    # wildcard *.niclasedge.com and comes back as 202.61.247.130 — this very
    # machine. A monitor check would then quietly test netcup's own Traefik and
    # report the Mini as healthy while it could be down.
    #
    # extra_hosts rather than `dns:`: pointing the container at the Mini's
    # CoreDNS would work for this zone and break everything else, because that
    # resolver answers REFUSED outside it by design (it listens on 0.0.0.0 and
    # must not become an open recursive resolver).
    extra_hosts:
      - "searxng.lan.niclasedge.com:100.113.130.16"
      - "searxng-vpn.lan.niclasedge.com:100.113.130.16"
      - "kibana.lan.niclasedge.com:100.113.130.16"
      - "traefik.lan.niclasedge.com:100.113.130.16"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      # Required from the second container on any given network onward —
      # without it Traefik picks the first container IP it sees.
      - "traefik.docker.network=proxy"
      # Single websecure router, no tls label: netcup's `websecure` entrypoint
      # already carries certResolver+secureHeaders@file (traefik-data/traefik.yml).
      - "traefik.http.routers.git-planner.entrypoints=websecure"
      - "traefik.http.routers.git-planner.rule=Host(`git.niclasedge.com`)"
      - "traefik.http.routers.git-planner.middlewares=user-auth@file"
      - "traefik.http.routers.git-planner.service=git-planner"
      - "traefik.http.services.git-planner.loadbalancer.server.port=8092"
      # Unauthenticated /healthz so the deploy healthcheck can reach it.
      - "traefik.http.routers.git-planner-health.entrypoints=websecure"
      - "traefik.http.routers.git-planner-health.rule=Host(`git.niclasedge.com`) && Path(`/healthz`)"
      - "traefik.http.routers.git-planner-health.service=git-planner"

networks:
  proxy:
    external: true

volumes:
  git-planner-data:
